<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First Food Safety — Certified Food Safety Consultants</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23028090'/%3E%3Cpath fill='white' d='M12 2L4 6v5c0 4.55 3.15 8.8 8 10 4.85-1.2 8-5.45 8-10V6l-8-4zm-1.5 11.5l-3-3 1.06-1.06 1.94 1.93 4.44-4.43 1.06 1.06-5.5 5.5z'/%3E%3C/svg%3E">
  <meta name="description" content="Dubai-based food safety consultancy. DM Check implementation, GMP-FSMS programs, and monthly hygiene management for restaurants.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ─── NAV ─── -->
  <nav id="navbar">
    <a href="#hero" class="nav-logo">
      <div class="nav-logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
      </div>
      <div class="nav-logo-text">FIRST FOOD<br><span>SAFETY</span></div>
    </a>
    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#process">Process</a></li>
      <li><a href="#cases">Case Studies</a></li>
      <li><a href="#pricing">Pricing</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <a href="#contact" class="nav-cta">Get Started</a>
    <div class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <div class="mobile-menu" id="mobile-menu">
    <a href="#about">About</a>
    <a href="#services">Services</a>
    <a href="#process">Process</a>
    <a href="#cases">Case Studies</a>
    <a href="#pricing">Pricing</a>
    <a href="#contact">Contact</a>
  </div>

  <!-- ─── HERO ─── -->
  <section id="hero">
    <div class="hero-grid-bg"></div>
    <div class="hero-glow"></div>
    <div class="hero-glow2"></div>
    <div class="hero-teal-bar"></div>
    <div class="hero-content" id="hero-content">
      <div class="section-loading"><div class="loader"></div></div>
    </div>
    <div class="hero-stats" id="hero-stats"></div>
  </section>

  <!-- ─── ABOUT ─── -->
  <section id="about">
    <div class="about-grid">
      <div class="about-visual reveal">
        <div class="about-main-card" id="about-card">
          <div class="section-loading"><div class="loader"></div></div>
        </div>
      </div>
      <div class="about-text">
        <div id="about-header">
          <div class="section-loading"><div class="loader"></div></div>
        </div>
        <div class="values-list" id="about-values"></div>
      </div>
    </div>
  </section>

  <!-- ─── SERVICES ─── -->
  <section id="services">
    <div class="services-header reveal" id="services-header">
      <div class="section-loading"><div class="loader"></div></div>
    </div>
    <div class="services-grid" id="services-grid"></div>
  </section>

  <!-- ─── TRUST BAR ─── -->
  <div class="trust-bar">
    <div class="trust-bar-inner" id="trust-bar-inner"></div>
  </div>

  <!-- ─── PROCESS ─── -->
  <section id="process">
    <div style="max-width:560px; margin-bottom:52px;" class="reveal" id="process-header">
      <div class="section-loading"><div class="loader"></div></div>
    </div>
    <div class="process-steps" id="process-steps"></div>
  </section>

  <!-- ─── CASE STUDIES ─── -->
  <section id="cases">
    <div style="max-width:560px; margin-bottom:52px;" class="reveal" id="cases-header">
      <div class="section-loading"><div class="loader"></div></div>
    </div>
    <div class="cases-grid" id="cases-grid"></div>
  </section>

  <!-- ─── PRICING ─── -->
  <section id="pricing">
    <div class="pricing-header reveal" id="pricing-header">
      <div class="section-loading"><div class="loader"></div></div>
    </div>
    <div class="pricing-grid" id="pricing-grid"></div>
  </section>

  <!-- ─── CONTACT ─── -->
  <section id="contact">
    <div class="contact-grid">
      <div class="contact-info reveal">
        <div id="contact-header"></div>
        <div class="contact-cards" id="contact-cards"></div>
      </div>
      <div class="contact-form reveal">
        <h3>Send Us a Message</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Your Name</label>
            <input type="text" placeholder="Restaurant Manager">
          </div>
          <div class="form-group">
            <label>Phone / WhatsApp</label>
            <input type="tel" placeholder="+971 XX XXX XXXX">
          </div>
        </div>
        <div class="form-group">
          <label>Restaurant Name</label>
          <input type="text" placeholder="Your Restaurant Name">
        </div>
        <div class="form-group">
          <label>Service You're Interested In</label>
          <select id="contact-form-services">
            <option value="">Loading...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Message (Optional)</label>
          <textarea placeholder="Tell us about your restaurant and any specific requirements..."></textarea>
        </div>
        <button class="form-submit" id="form-submit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          Send Message
        </button>
      </div>
    </div>
  </section>

  <!-- ─── FOOTER ─── -->
  <footer>
    <a href="#hero" class="footer-brand">
      <div class="footer-brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
      </div>
      <div class="footer-brand-text">FIRST FOOD SAFETY</div>
    </a>
    <div class="footer-copy">© 2025 First Food Safety. Dubai Municipality Certified.</div>
    <div class="footer-links">
      <a href="#services">Services</a>
      <a href="#pricing">Pricing</a>
      <a href="#cases">Case Studies</a>
      <a href="#contact">Contact</a>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
